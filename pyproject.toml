[project]
name = "pysm3i"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dheeraj Vittal Shenoy", email = "dheerajshenoy22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "pyqt6>=6.11.0",
    "pysm3>=3.4.6",
]

[project.scripts]
pysm3i = "pysm3i.app:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
